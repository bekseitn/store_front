# PostgreSQL. Versions 8.2 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On OS X with Homebrew:
#   gem install pg -- --with-pg-config=/usr/local/bin/pg_config
# On OS X with MacPorts:
#   gem install pg -- --with-pg-config=/opt/local/lib/postgresql84/bin/pg_config
# On Windows:
#   gem install pg
#       Choose the win32 build.
#       Install PostgreSQL and put its /bin directory on your path.
#
# Configure Using Gemfile
# gem 'pg'
#
default: &default
  adapter: postgresql
  encoding: utf8
  host: <%= ENV.fetch("STOREFRONT_DATABASE_HOST", "localhost") %>
  username: <%= ENV.fetch("STOREFRONT_DATABASE_USERNAME", "postgres") %>
  # Was a plaintext password committed here, shared identically across
  # every environment including "production" - overridable via ENV now;
  # the literal default is kept only so this repo's own local dev/test
  # Postgres role (already configured with it) keeps working with zero
  # setup. Never override this default with a value worth protecting -
  # it's still in git history.
  password: <%= ENV.fetch("STOREFRONT_DATABASE_PASSWORD", "dit321") %>
  # For details on connection pooling, see rails configuration guide
  # http://guides.rubyonrails.org/configuring.html#database-pooling
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

# One database per environment, not one shared physical database - a
# schema reload or cleanup triggered from the test or development side
# used to silently wipe the other's data too (this exact issue produced
# a live bug report earlier: a stale session order_id 404ing after a
# spec run wiped it out from under a real browser session).
development:
  <<: *default
  database: storefront_development

test:
  <<: *default
  database: storefront_test

# As with credentials, you never want to store sensitive information,
# like your database password, in your source code. If your source code
# is ever seen by anyone, they now have access to your database.
#
# Instead, provide the password as a unix environment variable when you
# boot the app. Read http://guides.rubyonrails.org/configuring.html#configuring-a-database
# for a full rundown on how to provide these environment variables in a
# production deployment.
#
# On Heroku and other platform providers, you may have a full connection
# URL available as an environment variable - this bypasses `default`
# entirely (adapter/host/username/etc. all come from the URL), which is
# correct: production should never fall back to the shared dev password.
production:
  url: <%= ENV["DATABASE_URL"] %>
